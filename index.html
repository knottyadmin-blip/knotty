/* 앱 안 확인 팝업: await askConfirm("…") → true(확인) / false(취소·바깥 누름·Esc) */
/* 한 줄 입력 팝업 (시스템 prompt 대신). 취소하면 null, 확인하면 입력한 글자(비어 있을 수 있음)를 돌려줘요 */
function askText(msg, initial = "", okLabel = "확인", cancelLabel = "취소", maxLen = 300){
  return new Promise(resolve => {
    const prev = document.querySelector(".ask-wrap"); if(prev) prev.remove();
    const wrap = document.createElement("div"); wrap.className = "ask-wrap";
    wrap.innerHTML = `<div class="ask-box" role="dialog" aria-modal="true" aria-labelledby="askMsg">
      <p id="askMsg">${esc(msg)}</p>
      <input class="ask-input" id="askInput" type="text" maxlength="${maxLen}" aria-labelledby="askMsg" autocomplete="off">
      <div class="ask-btns"><button type="button" class="ask-no">${esc(cancelLabel)}</button><button type="button" class="ask-ok">${esc(okLabel)}</button></div></div>`;
    const inp = wrap.querySelector("#askInput"); inp.value = initial || "";
    const done = v => { document.removeEventListener("keydown", onKey); wrap.classList.add("out"); setTimeout(() => wrap.remove(), 160); resolve(v); };
    const onKey = e => { if(e.key === "Escape") done(null); else if(e.key === "Enter" && !e.isComposing){ e.preventDefault(); done(inp.value.trim()); } };
    wrap.addEventListener("click", e => { if(e.target === wrap) done(null); });
    wrap.querySelector(".ask-no").onclick = () => done(null);
    wrap.querySelector(".ask-ok").onclick = () => done(inp.value.trim());
    document.addEventListener("keydown", onKey);
    document.body.appendChild(wrap);
    setTimeout(() => { try{ inp.focus({ preventScroll: true }); }catch(e){} }, 30);
  });
}
function askConfirm(msg, okLabel = "확인", cancelLabel = "취소"){
  return new Promise(resolve => {
    const prev = document.querySelector(".ask-wrap"); if(prev) prev.remove();
    const wrap = document.createElement("div"); wrap.className = "ask-wrap";
    wrap.innerHTML = `<div class="ask-box" role="alertdialog" aria-modal="true" aria-labelledby="askMsg">
      <p id="askMsg">${esc(msg)}</p>
      <div class="ask-btns"><button type="button" class="ask-no">${esc(cancelLabel)}</button><button type="button" class="ask-ok">${esc(okLabel)}</button></div></div>`;
    const done = v => { document.removeEventListener("keydown", onKey); wrap.classList.add("out"); setTimeout(() => wrap.remove(), 160); resolve(v); };
    const onKey = e => { if(e.key === "Escape") done(false); };
    wrap.addEventListener("click", e => { if(e.target === wrap) done(false); });
    wrap.querySelector(".ask-no").onclick = () => done(false);
    wrap.querySelector(".ask-ok").onclick = () => done(true);
    document.addEventListener("keydown", onKey);
    document.body.appendChild(wrap);
    setTimeout(() => { try{ wrap.querySelector(".ask-ok").focus({ preventScroll: true }); }catch(e){} }, 30);
  });
}
/* 비밀번호 칸: X 버튼으로 한 번에 지우기 + 확인 칸이 다르면 바로 안내 (화면이 새로 그려질 때마다 자동으로 붙어요) */
const PW_PAIRS = { "su-pw2": "su-pw", "np2": "np1" };
function enhancePw(root){
  root.querySelectorAll('input[type="password"]:not([data-pwx])').forEach(inp => {
    inp.dataset.pwx = "1";
    const wrap = document.createElement("span"); wrap.className = "pw-wrap";
    inp.parentNode.insertBefore(wrap, inp); wrap.appendChild(inp);
    const x = document.createElement("button"); x.type = "button"; x.className = "pw-x"; x.setAttribute("aria-label", "비밀번호 지우기"); x.textContent = "×";
    wrap.appendChild(x);
    const sync = () => { x.hidden = !inp.value; };
    x.addEventListener("mousedown", e => e.preventDefault());
    x.addEventListener("click", () => { inp.value = ""; inp.dispatchEvent(new Event("input", { bubbles: true })); sync(); try{ inp.focus({ preventScroll: true }); }catch(e){} });
    inp.addEventListener("input", sync); sync();
  });
  Object.entries(PW_PAIRS).forEach(([second, first]) => {
    const b = root.querySelector("#" + second), a = document.getElementById(first);
    if(!b || !a || b.dataset.pwpair) return; b.dataset.pwpair = "1";
    const field = b.closest(".field") || b.parentNode;
    const tip = document.createElement("span"); tip.className = "f-err"; tip.setAttribute("role", "alert"); tip.hidden = true; field.appendChild(tip);
    const run = () => {
      const bad = !!b.value && b.value !== a.value && (b.value.length >= a.value.length || !a.value.startsWith(b.value));
      tip.textContent = bad ? "비밀번호가 서로 달라요." : ""; tip.hidden = !bad; field.classList.toggle("bad", bad);
    };
    b.addEventListener("input", run); b.addEventListener("blur", () => { if(b.value && b.value !== a.value){ tip.textContent = "비밀번호가 서로 달라요."; tip.hidden = false; field.classList.add("bad"); } });
    a.addEventListener("input", () => { if(b.value) run(); });
  });
}

/* 입력하는 동안 조건에 안 맞으면 칸 바로 아래에 안내를 띄워요 (빈 칸이면 지워요) */
function liveCheck(input, rule){
  if(!input) return;
  const field = input.closest(".field") || input.parentNode;
  let tip = field.querySelector(".f-err");
  if(!tip){ tip = document.createElement("span"); tip.className = "f-err"; tip.setAttribute("role", "alert"); field.appendChild(tip); }
  const run = () => { const m = input.value.trim() ? rule(input.value.trim()) : ""; tip.textContent = m || ""; tip.hidden = !m; field.classList.toggle("bad", !!m); };
  input.addEventListener("input", run); input.addEventListener("blur", run);
  if(input.value.trim()) run(); else tip.hidden = true;
}

      photoCache[MY] = { ver: changed ? row.photo_ver : (u.photoVer || 0), urls: draft.photos.slice(), thumbs: draft.photos.slice(), exp: Date.now() + 50 * 60000 };
      await loadAll();
      toast(editing ? "저장했어요." : "내 정보를 저장했어요.");
      homeTab = "home"; go("home");
    }catch(x){
      try{ console.error("profile save failed", x && (x.code || ""), x && (x.message || x)); }catch(e){}
      toast(x && x.code === "23505" ? "이미 사용 중인 닉네임이에요."
        : x && (x.code === "23514" || x.code === "42703" || x.code === "PGRST204") ? "서버 설정이 최신이 아니라 저장하지 못했어요. 관리자에게 알려 주세요. (setup.sql 다시 실행 필요)"
        : "저장하지 못했어요. 잠시 뒤 다시 시도해 주세요." + (x && (x.code || x.statusCode || x.status) ? ` (오류 ${x.code || x.statusCode || x.status})` : ""));
      btn.disabled = false; btn.textContent = editing ? "저장하기" : "저장하고 시작하기";
    }
  };
}

/* 매칭 상대 프로필: 오늘 이어진 상대 한 명만 보여요 */
function partnerCard(u, o){
  const p = o.profile, pr0 = findPair(curDay(), u.id) || {};
  const places = MEET_PLACES.length === 1 ? MEET_PLACES.slice() : (pr0.places || []);
  const acts = pr0.acts || [];
  const loc = p.region + (p.gu ? " " + p.gu : "");
  const work = "";   // 직장 위치는 v5.2부터 받지 않아요
  const shared = new Set(u.profile.likes);
  const pr = findPair(curDay(), u.id);
  const mine = pr && pr.resp ? pr.resp[u.id] : null;
  const st = pr ? pairStatus(pr) : "pending";
  let decide;
  if(st === "connected"){
    const room = pr.id, unread = unreadChat(room);

const REMATCH_DAYS = 14;

/* 수락 상태: 둘 다 좋아요 → connected, 한 명이라도 넘기기 → passed, 그 외 → pending */
function pairStatus(p){
  if(p.closed) return "closed";

  if(r.length === 2 && r.every(x => x === "like")) return "connected";

}
function findPair(date, uid){
  const r = db.matches && db.matches[date]; if(!r) return null;

}
async function respond(date, uid, val){

  if(mineNow && !(mineNow === "like" && val === "pass" && !other)) return false;   // 좋아요 → 넘기기만, 상대가 답하기 전에
  try{ await q(sb.rpc("respond_match", { m_id: p.id, val })); }

  }

}

/* ===== matching ===== */
/* 절대 조건(어기면 후보 제외): 페미니즘 · 나이(50은 50세 이상) · 성향 궁합 — 서로 맞아야 해요.
   함께 지키는 규칙: 만날 장소 겹침 · 페미니즘 지향↔지양 금지 · 차단 · 14일 안(오늘 포함)에 이어졌던 사이.
   우선순위 9가지(거리·헤어스타일·음주·흡연·관심사·데이트 스타일·키·연락 스타일·원하는 관계)는 각자 정한 순서로 점수를 매겨요.
   1순위 256점 · 2순위 128 · … · 9순위 1점 → 1순위 하나가 나머지를 다 합친 것보다 커요.
   가산점: 연애 가치관 테스트에서 같은 답 1개당 1점 (최대 5점, 두 사람 점수에 똑같이 더해요).
   1차: 서로의 1순위가 꼭 맞아야 해요.  2차: 절대 조건만 맞으면 누구든 이어요(우선순위 점수는 순서에만 써요).
   짝 순서: 두 사람 중 낮은 점수가 높은 짝 → 합계가 높은 짝 (한쪽만 만족하는 짝보다 서로 고르게 만족하는 짝이 먼저) */
const PRIO_KEYS = ["dist", "hair", "drink", "smoke", "likes", "dateStyle", "height", "contact", "relation"];
const PRIO_LABEL = { dist: "거리", hair: "헤어스타일", drink: "음주", smoke: "흡연", likes: "관심사", dateStyle: "데이트 스타일", height: "키", contact: "연락 스타일", relation: "원하는 관계" };
const PRIO_DEFAULT = PRIO_KEYS.slice();
const PRIO_W = [256, 128, 64, 32, 16, 8, 4, 2, 1];
const prioOf = j => { const p = ((j && j.prio) || []).slice();
  return p.length === PRIO_KEYS.length && PRIO_KEYS.every(k => p.includes(k)) ? p : PRIO_DEFAULT.slice(); };
const heightOk = (j, prof) => { const sel = heightSel(j); if(sel.length){ const h = Number(prof.height) || 0; return !!h && sel.some(x => HEIGHT_BANDS[x](h)); } return heightOk0(j, prof); };
const heightOk0 = (j, prof) => { const lo = j.heightMin ?? HEIGHT_LO, hi = j.heightMax ?? HEIGHT_HI; if(lo <= HEIGHT_LO && hi >= HEIGHT_HI) return true; const h = Number(prof.height) || 0; return !!h && h >= lo && h <= hi; };
function giveOk(a, b){
  return (a==="깁앤텍" && b==="깁앤텍") || (a==="온깁" && b==="온텍") || (a==="온텍" && b==="온깁");
}
const prefOk = (pref, val) => pref === "상관없음" || pref === "무관" || (!!val && pref === val);
function evalPair(A, B, round){
  round = round === 2 ? 2 : 1;
  const pa = A.profile, pb = B.profile, ja = A.join, jb = B.join;
  const norm = arr => MEET_PLACES.length === 1 ? MEET_PLACES.slice() : (arr || []);
  const places = norm(ja.places).filter(x => norm(jb.places).includes(x));
  const acts = (ja.acts || []).filter(x => (jb.acts || []).includes(x));
  const hairOk = (ideal, h) => !!ideal && (ideal.includes("상관없음") || ideal.includes(h));
  const wantG = (j, v) => !j.wantGive || !j.wantGive.length ? null : (j.wantGive.includes("상관없음") || (!!v && j.wantGive.includes(v)));
  const ga = wantG(ja, pb.give), gb = wantG(jb, pa.give);
  const g = ga === null || gb === null ? giveOk(pa.give, pb.give) : (ga && gb);
  // metA: A가 정한 조건에 B가 맞는지 / metB: 그 반대
  const exA = cleanExtras(pa.extras), exB = cleanExtras(pb.extras), wa = ja.wants || {}, wb = jb.wants || {};
  const sharesLike = (pa.likes || []).some(x => (pb.likes || []).includes(x));
  const metA = { dist: !!distOk(ja, pa, pb), hair: hairOk(ja.hair, pb.hair), drink: wantOk(wa.want_drink, exB.drink), smoke: wantOk(wa.want_smoke, exB.smoke), likes: sharesLike,
    dateStyle: wantOk(wa.want_date, exB.dateStyle), height: heightOk(ja, pb), contact: wantOk(wa.want_contact, exB.contact), relation: wantOk(wa.want_relation, exB.relation) };
  const metB = { dist: !!distOk(jb, pb, pa), hair: hairOk(jb.hair, pa.hair), drink: wantOk(wb.want_drink, exA.drink), smoke: wantOk(wb.want_smoke, exA.smoke), likes: sharesLike,
    dateStyle: wantOk(wb.want_date, exA.dateStyle), height: heightOk(jb, pa), contact: wantOk(wb.want_contact, exA.contact), relation: wantOk(wb.want_relation, exA.relation) };
  const absFem = prefOk(ja.feminism, pb.feminism) && prefOk(jb.feminism, pa.feminism), absAge = ageFits(ja, pb.age) && ageFits(jb, pa.age);
  const pA = prioOf(ja), pB = prioOf(jb);
  const rA = pA.reduce((t, k, i) => t + (metA[k] ? PRIO_W[i] : 0), 0);   // 우선순위 점수
  const rB = pB.reduce((t, k, i) => t + (metB[k] ? PRIO_W[i] : 0), 0);
  const quiz = quizSame(A.quiz, B.quiz);                                   // 가치관 테스트 가산점 (같은 답 개수)
  const kxA = wantExHits(ja.wantEx, exB), kxB = wantExHits(jb.wantEx, exA);   // 더 원하는 점 가산점
  const sA = rA + kxA + quiz, sB = rB + kxB + quiz;
  const both = k => (metA[k] ? 1 : 0) + (metB[k] ? 1 : 0);
  const age = (ageFits(ja, pb.age) ? 1 : 0) + (ageFits(jb, pa.age) ? 1 : 0), fem = (prefOk(ja.feminism, pb.feminism) ? 1 : 0) + (prefOk(jb.feminism, pa.feminism) ? 1 : 0);
  const hair = both("hair"), dist = both("dist"), give = g ? 2 : 0;
  const likes = pa.likes.filter(x => pb.likes.includes(x));
  let blocked = "";
  const testPair = TEST && (A.id === TEST_BOT || B.id === TEST_BOT);   // 테스트 상대는 조건과 상관없이 항상 이어져요
  if(testPair) blocked = "";
  else if(!places.length) blocked = "장소";
  else if(!femAny(pa.feminism) && !femAny(pb.feminism) && pa.feminism !== pb.feminism) blocked = "페미니즘";
  else if(!absFem) blocked = "페미니즘";
  else if(!absAge) blocked = "나이";
  else if(!g) blocked = "성향";
  else if(round === 1 && !(metA[pA[0]] && metB[pB[0]])) blocked = "1순위";
  const priOf = X => X.pri !== undefined ? !!X.pri : !!(X.join && X.join.useThread && (X.threads || 0) > 0);
  const pri = (priOf(A) ? 1 : 0) + (priOf(B) ? 1 : 0);
  const height = both("height"), drink = both("drink"), smoke = both("smoke"), dateStyle = both("dateStyle"), contact = both("contact"), relation = both("relation");
  return { places, acts, age, give, fem, hair, dist, height, drink, smoke, dateStyle, contact, relation, likes, blocked, round, pri, sA, sB, rA, rB, quiz, pA, pB, metA, metB,
    key: [places.length ? 1 : 0, pri, Math.min(sA, sB), sA + sB, likes.length, places.length] };
}
function cmpKey(a, b){ for(let i=0;i<a.length;i++){ if(a[i]!==b[i]) return a[i]-b[i]; } return 0; }

  return Object.values(db.users).filter(u => u.status==="approved" && u.profile && u.join && u.joinDate===date);

function pairCard(A, B, rank, round){

      ${row("절대", "페미니즘", `${esc(pa.feminism||"-")} ↔ ${esc(pb.feminism||"-")}`, stChip(e.fem))}
      ${row("절대", "나이", `${pa.age}세 ↔ ${pb.age}세`, stChip(e.age))}
      ${row("절대", "성향", `${esc(pa.give)} ↔ ${esc(pb.give)}<br><small>원함: ${esc((A.join.wantGive || []).join(", ") || "-")} / ${esc((B.join.wantGive || []).join(", ") || "-")}</small>`, stChip(e.give, ["안 맞음", "", "맞음"]))}

function flagChips(id){
  const rs = (db.reviews || []).filter(r => r.to === id);
  const n = f => rs.filter(f).length;
  const items = [
    ["신고", (db.reports || []).filter(r => r.target === id).length, "no"],
    ["안전 신고", n(r => r.safety), "no"],
    ["노쇼", n(r => r.met === "noshow"), "no"],
    ["비매너", n(r => r.manner === "bad" || (r.bads || []).some(b => b === "rude" || b === "drink")), "half"],
    ["지각", n(r => (r.bads || []).includes("late")), "half"]
  ].filter(x => x[1]);
  const lf = (db.leftMembers || []).filter(x => x.rejoinedAs === id).sort((a, b) => b.at - a.at)[0];
  const re = !lf ? "" : `<em class="st no" title="같은 이메일로 탈퇴한 적이 있어요">재가입 · ${new Date(lf.at).toLocaleDateString("ko-KR", { timeZone: "Asia/Seoul", month: "numeric", day: "numeric" })} 탈퇴${lf.status === "suspended" ? " (정지 중 탈퇴)" : ""}${lf.reports ? ` · 신고 ${lf.reports}` : ""}</em>`;
  return items.length || re ? `<span class="flags">${re}${items.map(([t, c, k]) => `<em class="st ${k}">${t} ${c}</em>`).join("")}</span>` : "";
}
function respChip(p){
  if(!p) return "";
  const st = pairStatus(p);
  return st === "closed" ? '<em class="st no">차단됨</em>' : st === "connected" ? '<em class="st ok">매칭 완료</em>' : st === "passed" ? '<em class="st no">넘김</em>'
    : `<em class="st half">응답 ${Object.keys(p.resp || {}).length}/2</em>`;
}

            <button class="btn btn-ghost sm" type="button" data-copy="${esc(r.temp)}">복사</button></div>
          <p class="hint" style="margin:0">이 비밀번호를 ${mail ? esc(mail) + "로 " : "가입한 이메일로 "}메일로 보내 주세요. 로그인하면 새 비밀번호를 정하게 돼요.</p>
          <button class="btn btn-ghost" type="button" data-req-close="${r.id}">전달 완료</button>`
        : `<div class="admin-actions">
            <button class="btn btn-ghost" type="button" data-req-skip="${r.id}">삭제</button>
            <button class="btn btn-primary" type="button" data-req-issue="${r.id}" ${u ? "" : "disabled"}>임시 비밀번호 발급</button>
          </div>`}
      </article>`; }).join("")
    : `<div class="card empty">들어온 요청이 없어요.</div>`}
  </div>

  <div class="h-sec" style="margin:26px 4px 12px"><h2>탈퇴 기록</h2><span class="count">${(db.leftMembers || []).length}명</span></div>
  <section class="card history">
    ${(db.leftMembers || []).length ? db.leftMembers.map(x => `
      <div class="rv-row ${x.rejoinedAs ? "alert" : ""}">
        <div class="rv-top"><b>${esc(x.email || "(이메일 없음)")}</b><span>${fmt(x.at)} 탈퇴</span></div>
        <div class="flags">${x.nickname ? `<em class="st half">${esc(x.nickname)}</em>` : ""}${x.status === "suspended" ? `<em class="st no">정지 중 탈퇴</em>` : x.status === "rejected" ? `<em class="st no">반려 상태</em>` : ""}${x.reports ? `<em class="st no">신고 ${x.reports}</em>` : ""}${x.hadMatch ? `<em class="st half">매칭 중 탈퇴</em>` : ""}${x.rejoinedAs ? `<em class="st no">재가입 ${fmt(x.rejoinedAt)}${db.users[x.rejoinedAs] && db.users[x.rejoinedAs].profile ? " · " + esc(db.users[x.rejoinedAs].profile.nickname) : ""}</em>` : ""}</div>
        <button class="btn btn-ghost sm" type="button" data-left-del="${x.id}" style="margin-top:8px">기록 지우기</button>
      </div>`).join("") : `<div class="empty" style="padding:20px 8px">탈퇴한 회원이 없어요.</div>`}
  </section>
  <p class="hint" style="margin:10px 4px 0">같은 이메일로 다시 가입하면 여기와 '회원 승인' 목록에 '재가입'으로 표시돼요. 기록은 1년 뒤 자동으로 지워지고, 먼저 지울 수도 있어요. 지우면 재가입 표시와 신고용 대화 기록도 함께 사라져요.</p>

  <div class="h-sec" style="margin:26px 4px 12px"><h2>만남 후기</h2><span class="count">${reviews.length}건</span></div>
  <section class="card history">
    ${reviews.length ? reviews.slice().sort((x, y) => (y.safety ? 1 : 0) - (x.safety ? 1 : 0) || y.at - x.at).map(r => `
      <div class="rv-row ${r.safety ? "alert" : ""}">
        <div class="rv-top"><b>${esc(r.fromName)} → ${esc(r.toName)}</b><span>${esc(r.date.slice(5).replace("-", "/"))}</span></div>
        <div class="flags">${reviewChips(r)}</div>
        ${(r.goods || []).length ? `<p class="rv-list"><b>좋았던 점</b> ${esc(r.goods.map(v => rvLabel("goods", v)).join(", "))}</p>` : ""}
        ${(r.bads || []).length ? `<p class="rv-list bad"><b>아쉬운 점</b> ${esc(r.bads.map(v => rvLabel("bads", v)).join(", "))}</p>` : ""}
        ${r.note ? `<p>${esc(r.note)}</p>` : ""}
      </div>`).join("") : `<div class="empty" style="padding:20px 8px">아직 들어온 후기가 없어요.</div>`}
  </section>
  <p class="hint" style="margin:10px 4px 0">안전 문제 신고는 맨 위에 보여요. 노쇼·비매너·지각 후기를 받은 회원은 '회원 승인' 목록에 표시돼요.</p>`;

  wireReports(root);
  root.querySelectorAll("[data-left-del]").forEach(b => b.onclick = async () => {
    if(!(await askConfirm("이 탈퇴 기록을 지울까요? 재가입 표시와 신고용 대화 기록도 함께 지워져요."))) return;
    b.disabled = true;
    try{ await q(sb.rpc("admin_delete_left", { p_id: +b.dataset.leftDel })); toast("기록을 지웠어요."); }catch(x){ toast("지우지 못했어요."); }
    await refresh();
  });
  root.querySelectorAll("[data-req-issue]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try{ await q(sb.rpc("admin_reset_password", { p_req: +b.dataset.reqIssue })); }
    catch(x){ b.disabled = false; return toast(errText(x).includes("가입") ? "가입 정보가 없는 아이디예요." : "발급하지 못했어요. 다시 시도해 주세요."); }
    await refresh();
  });
  root.querySelectorAll("[data-req-skip],[data-req-close]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try{ await q(sb.rpc("admin_close_request", { p_req: +(b.dataset.reqSkip || b.dataset.reqClose) })); }catch(x){ toast("처리하지 못했어요."); }
    await refresh();
  });
  root.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => {
    const v = b.dataset.copy;
    try{ navigator.clipboard.writeText(v).then(() => toast("복사했어요."), () => toast("길게 눌러 직접 복사해 주세요.")); }
    catch(e){ toast("길게 눌러 직접 복사해 주세요."); }
  });
}

async function logout(){
  try{ await sb.auth.signOut(); }catch(e){}
  resetClientState(); authTab = "login"; go("auth");
}

boot();
})();
</script>
</body>
</html>
